<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circle Soccer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" class="hidden"></canvas>

  <div id="ui">
    <section id="menu" class="screen">
      <h1 class="logo"><span class="dot red"></span>Circle Soccer<span class="dot blue"></span></h1>

      <label class="field">Nickname
        <input id="name" maxlength="16" autocomplete="off" spellcheck="false">
      </label>

      <div class="card">
        <h3>Quick Play</h3>
        <div class="row">
          <button class="primary" data-queue="1v1">1 v 1</button>
          <button class="primary" data-queue="2v2">2 v 2</button>
        </div>
      </div>

      <div class="card">
        <h3>Private Room</h3>
        <div class="row">
          <select id="create-mode" aria-label="Room mode">
            <option value="1v1">1 v 1</option>
            <option value="2v2" selected>2 v 2</option>
            <option value="3v3">3 v 3</option>
          </select>
          <button id="create-room">Create room</button>
        </div>
        <div class="row">
          <input id="join-code" maxlength="5" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Room code">
          <button id="join-room">Join</button>
        </div>
      </div>

      <div class="row">
        <button class="ghost" id="open-settings">Settings</button>
      </div>
      <p id="conn" class="muted">Connecting…</p>
    </section>

    <section id="queue" class="screen hidden">
      <h2>Finding a <span id="queue-mode"></span> match</h2>
      <div class="spinner"></div>
      <p id="queue-count" class="big"></p>
      <button id="cancel-queue">Cancel</button>
    </section>

    <section id="room" class="screen hidden">
      <h2>Room <span id="room-code" class="code"></span></h2>
      <div class="row">
        <button id="copy-link" class="ghost">Copy invite link</button>
        <label class="inline">Mode
          <select id="room-mode">
            <option value="1v1">1 v 1</option>
            <option value="2v2">2 v 2</option>
            <option value="3v3">3 v 3</option>
          </select>
        </label>
      </div>
      <div class="teams">
        <div class="team red">
          <h3>Red</h3>
          <ul id="team-0"></ul>
          <button data-team="0">Join Red</button>
        </div>
        <div class="team spec">
          <h3>Spectators</h3>
          <ul id="team-spec"></ul>
          <button data-team="-1">Spectate</button>
        </div>
        <div class="team blue">
          <h3>Blue</h3>
          <ul id="team-1"></ul>
          <button data-team="1">Join Blue</button>
        </div>
      </div>
      <div class="row">
        <button id="start-match" class="primary">Start match</button>
        <button id="leave-room">Leave room</button>
      </div>
      <p id="room-hint" class="muted"></p>
    </section>

    <section id="result" class="overlay hidden">
      <div class="panel">
        <h2 id="result-title"></h2>
        <p id="result-score" class="score"></p>
        <ul id="result-goals"></ul>
        <div class="row" id="result-actions"></div>
      </div>
    </section>

    <section id="pause" class="overlay hidden">
      <div class="panel">
        <h2>Menu</h2>
        <div class="col">
          <button id="resume" class="primary">Resume</button>
          <button id="pause-settings">Settings</button>
          <button id="leave-match">Leave match</button>
        </div>
      </div>
    </section>

    <section id="settings" class="overlay modal hidden">
      <div class="panel wide">
        <h2>Settings</h2>
        <h3>Controls</h3>
        <table id="binds"></table>
        <h3>Sound</h3>
        <label class="inline">Volume <input id="volume" type="range" min="0" max="1" step="0.05"></label>
        <div class="row">
          <button id="reset-binds" class="ghost">Reset to defaults</button>
          <button id="close-settings" class="primary">Done</button>
        </div>
      </div>
    </section>

    <div id="toast" class="hidden"></div>
  </div>

  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
